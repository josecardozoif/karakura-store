<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" type="text/css" href="style-cad.css" />
    <title>Cadastro - Karakura Store</title>
  </head>
  <body>
    
    <div class="header">
      <h1 class="title">Karakura Store</h1>
      <div class="search-section">
        <form class="search-form">
          <input
            type="text"
            class="search-input"
            placeholder="Buscar produtos, marcas e muito mais..."
          />
          <button type="submit" class="search-button">Buscar</button>
        </form>
        <div class="filters">
          <div class="filter-group">
            <label for="category">Categoria:</label>
            <select id="category" class="filter-select">
              <option value="">Todas</option>
              <option value="vehicles">Veículos</option>
              <option value="supermarket">Supermercado</option>
              <option value="technology">Tecnologia</option>
              <option value="house">Casa e Móveis</option>
              <option value="homeappliances">Eletrodomésticos</option>
              <option value="sports">Esporte e Fitness</option>
              <option value="tools">Ferramentas</option>
              <option value="builds">Construção</option>
              <option value="commerces">Indústria e Comércio</option>
              <option value="petshops">Pet Shop</option>
              <option value="health">Saúde</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="availability">Disponibilidade:</label>
            <select id="availability" class="filter-select">
              <option value="all">Todos</option>
              <option value="discount">Desconto</option>
              <option value="shipshipping">Frete Grátis</option>
            </select>
          </div>
          <div class="filter-group">
            <label for="sort">Ordenar por:</label>
            <select id="sort" class="filter-select">
              <option value="relevance">Relevância</option>
              <option value="title-asc">Título (A-Z)</option>
              <option value="title-desc">Título (Z-A)</option>
              <option value="newest">Mais Recentes</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <nav>
      <ul>
<li><a href="./index.html">Início</a></li>
        <li><a href="./produtos.html">Produtos</a></li>
        <li><a href="#">Ofertas</a></li>
        <li><a href="#">Cupons</a></li>
        <li><a href="#">Supermercados</a></li>
        <li><a href="#">Moda</a></li>
        <li><a href="#">Frutas</a></li>
      </ul>
    </nav>

    <div class="banner">
      <img class="banner-image" src="./img/ban-cad2.jpg" alt="banner" />
    </div>

<main>
        <div class="login-container">
            <h2 class="form-title">Login de Usuário</h2>
            <form action="#" method="post">
                <div class="form-group">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email" class="form-control" required>
                </div>
                <div class="form-group">
                    <label for="password">Senha:</label>
                    <input type="password" id="password" name="password" class="form-control" required>
                </div>

                <div class="btn-group">
                  <button type="submit" class="btn-option">Cliente</button>
                  <button type="submit" class="btn-option">Vendedor</button>
                </div>
                
                <button type="submit" class="btn-login">Entrar</button>

                <div class="forgot-password">
                    <a href="#">Esqueceu sua senha?</a>
                </div>
                <div class="register-link">
                    <p>Ainda não tem uma conta? <a href="#">Cadastre-se</a></p>
                </div>
            </form>
        </div>
 
</main>

<footer>
      <p>
        &copy; 2025 Karakura Store - Todos os direitos reservados, Tite Kubo.
      </p>
    </footer>
  </body>
</html>
